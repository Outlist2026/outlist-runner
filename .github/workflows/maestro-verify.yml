name: Maestro verify
run-name: "maestro-verify ${{ inputs.repo }}@${{ inputs.ref }}"

# Read-only. Builds a debug APK of a private source ref against a local Supabase on the runner and runs the Maestro flows
# on an Android 34 emulator. Same steps as the source repo's maestro-android.yml (private Actions minutes are blocked).
# Nothing is uploaded: this repository is public.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repository'
        required: true
        type: choice
        default: 'FlavioApric/outlist'
        options:
          - FlavioApric/outlist
          - Outlist2026/outlist
      ref:
        description: 'Branch, tag or commit'
        required: true
        default: 'release/3.5'
      runs:
        description: 'Consecutive Maestro runs (1-10)'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  maestro:
    name: Maestro smoke (Android API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 170
    permissions:
      contents: read
    env:
      IN_RUNS: ${{ inputs.runs }}
      IN_APK_SOURCE: debug
      IN_REPO: ${{ inputs.repo }}
      IN_REF: ${{ inputs.ref }}
      MAESTRO_VERSION: '2.11.0'
      MAESTRO_ZIP_SHA256: '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a'
    steps:
      - name: Validate inputs
        run: |
          case "$IN_RUNS" in ''|*[!0-9]*) echo "::error::runs must be a positive integer"; exit 1;; esac
          if [ "$IN_RUNS" -lt 1 ] || [ "$IN_RUNS" -gt 10 ]; then echo "::error::runs out of range (1-10)"; exit 1; fi
          printf '%s' "$IN_REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "::error::ref has odd characters"; exit 1; }
          case "$IN_REPO" in Outlist2026/outlist|FlavioApric/outlist) ;; *) echo "::error::repo not allowed"; exit 1 ;; esac

      - name: Checkout source (read-only token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ inputs.repo == 'FlavioApric/outlist' && secrets.PERSONAL_REPO_TOKEN || secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false

      - name: Free disk space (dotnet, ghc and CodeQL are not needed; the Android SDK is)
        timeout-minutes: 10
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /opt/microsoft /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Maestro CLI (pinned version and checksum)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"

      # ---------------- APK: debug build against the local backend ----------------
      - name: Setup pnpm
        if: env.IN_APK_SOURCE == 'debug'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '9'

      - name: Setup Node 22
        if: env.IN_APK_SOURCE == 'debug'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        timeout-minutes: 15
        if: env.IN_APK_SOURCE == 'debug'
        run: |
          npm ci
          pnpm --dir app install --frozen-lockfile

      - name: Start local Supabase (seeded)
        timeout-minutes: 20
        if: env.IN_APK_SOURCE == 'debug'
        run: npm run db:local:start

      - name: Export seed credentials to later steps (masked)
        if: env.IN_APK_SOURCE == 'debug'
        run: |
          set -euo pipefail
          set -a; . ./.env.test.local; set +a
          echo "::add-mask::${TEST_USER_PASSWORD}"
          {
            echo "TEST_USER_EMAIL=${TEST_USER_EMAIL}"
            echo "TEST_USER_PASSWORD=${TEST_USER_PASSWORD}"
            echo "SEED_EVENT_PREFIX=E2E Seed Event"
          } >> "$GITHUB_ENV"

      - name: Build web bundle against the local Supabase
        if: env.IN_APK_SOURCE == 'debug'
        working-directory: app
        run: |
          set -euo pipefail
          set -a; . ../.env.test.local; set +a
          export VITE_SUPABASE_URL="$SUPABASE_URL" VITE_SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          export VITE_SUPABASE_FEATURES_ENDPOINT="$SUPABASE_URL/functions/v1/config-features"
          export VITE_SUPABASE_AUTH_REGISTER_ENDPOINT="$SUPABASE_URL/functions/v1/auth-register"
          export VITE_CLOUDINARY_CLOUD_NAME=outlist-local-test-disabled VITE_CLOUDINARY_UPLOAD_PRESET=outlist-local-test-disabled
          pnpm run build

      - name: Sync Capacitor and build the debug APK
        if: env.IN_APK_SOURCE == 'debug'
        working-directory: app
        env:
          CAP_E2E_LOCAL_BACKEND: '1'
        run: |
          set -euo pipefail
          node scripts/copy-firebase-config.mjs
          npx --yes @capacitor/cli@7.6.7 sync android
          # the WebView talks plain http to 127.0.0.1 (adb reverse): allow cleartext in the CI copy of the manifest only
          grep -q 'android:usesCleartextTraffic' android/app/src/main/AndroidManifest.xml || \
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -n "$APK"
          echo "APK_PATH=$PWD/$APK" >> "$GITHUB_ENV"
          echo "APK_MODE=debug" >> "$GITHUB_ENV"

      - name: Free disk space before booting the emulator (the AVD needs several GB)
        if: env.IN_APK_SOURCE == 'debug'
        run: |
          rm -rf "$HOME/.gradle" "$HOME/.npm" app/node_modules node_modules app/android/.gradle app/android/build app/dist
          df -h /


      # ---------------- Emulator + Maestro series ----------------
      - name: Run Maestro series on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          RUNS: ${{ inputs.runs }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/launch/maestro-ci-run.sh


      - name: Stop local Supabase
        if: always() && env.IN_APK_SOURCE == 'debug'
        run: npm run db:local:stop
