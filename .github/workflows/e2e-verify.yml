name: E2E verify
run-name: "e2e-verify ${{ inputs.repo }}@${{ inputs.ref }}"

# Read-only. Runs the Playwright E2E suites (smoke + full, local Supabase on the runner) on a ref of a private source repo.
# Same steps as the source repo's CI e2e jobs, which cannot run there (private Actions minutes blocked).
# Nothing is uploaded: no reports or artifacts leave the runner, because this repository is public.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repository'
        required: true
        type: choice
        default: 'FlavioApric/outlist'
        options:
          - FlavioApric/outlist
          - Outlist2026/outlist
      ref:
        description: 'Branch, tag or commit'
        required: true
        default: 'release/3.5'

permissions:
  contents: read

concurrency:
  group: e2e-verify-${{ inputs.repo }}-${{ inputs.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  e2e:
    name: E2E ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smoke
            cmd: 'npm run test:e2e:smoke'
          - name: Mobile Chrome + Desktop admin
            cmd: 'npx playwright test --project="Mobile Chrome" --project="Desktop admin" --workers=2'
          - name: Mobile Safari
            cmd: 'npx playwright test --project="Mobile Safari" --workers=1'
    env:
      IN_REPO: ${{ inputs.repo }}
      IN_REF: ${{ inputs.ref }}
    steps:
      - name: Validate input
        run: |
          printf '%s' "$IN_REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "::error::ref has odd characters"; exit 1; }
          case "$IN_REPO" in Outlist2026/outlist|FlavioApric/outlist) ;; *) echo "::error::repo not allowed"; exit 1 ;; esac
      - name: Checkout source (read-only token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ inputs.repo == 'FlavioApric/outlist' && secrets.PERSONAL_REPO_TOKEN || secrets.SOURCE_REPO_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install dependencies
        timeout-minutes: 15
        run: |
          (cd app && pnpm install --frozen-lockfile)
          npm ci
      - name: apt network timeouts (a stalled Ubuntu mirror download retries in seconds instead of hanging)
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts
          echo 'Acquire::http::Timeout "20";' | sudo tee -a /etc/apt/apt.conf.d/80-ci-timeouts
          echo 'Acquire::https::Timeout "20";' | sudo tee -a /etc/apt/apt.conf.d/80-ci-timeouts
      - name: Install Playwright browsers
        timeout-minutes: 15
        # A stalled download (seen 3 times on 6/11) gets a second attempt; this retries the setup download only, never a test.
        run: |
          timeout 420 npx playwright install --with-deps chromium webkit && exit 0
          echo "attempt 1 stalled or failed: switching apt from the Azure mirror to archive.ubuntu.com"
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update -qq || true
          timeout 420 npx playwright install --with-deps chromium webkit && exit 0
          echo "attempt 2 failed"; exit 1
      - name: Free disk space
        timeout-minutes: 10
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Start local Supabase
        timeout-minutes: 20
        run: npm run db:local:start
      - name: SQL tests of the release (smoke job only, local Supabase)
        if: matrix.name == 'smoke'
        timeout-minutes: 15
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:sql:r35'] ? 0 : 1)"; then npm run test:sql:r35; else echo "no test:sql:r35 on this ref"; fi
      - name: Run E2E
        env:
          CI: 'true'
          E2E_SKIP_SCREENSHOTS: '1'
          SUITE_CMD: ${{ matrix.cmd }}
        run: bash -c "$SUITE_CMD"
      - name: Failure context (page snapshot of each failed test, edge function log)
        if: failure()
        run: |
          for f in $(find test-results -name error-context.md 2>/dev/null | head -10); do echo "==== $f"; head -c 5000 "$f"; echo; done
          c=$(docker ps --format '{{.Names}}' | grep -m1 edge_runtime || true)
          if [ -n "$c" ]; then echo "==== edge runtime log ($c)"; docker logs --tail 150 "$c" 2>&1 | grep -viE "apikey|authorization|bearer|service_role|password" || true; fi
      - name: Stop local Supabase
        if: always()
        run: npm run db:local:stop
