name: Hotfix verify
run-name: "hotfix-verify ${{ inputs.repo }}@${{ inputs.ref }}"

# Read-only. Runs the fast gate for a web-only hotfix on a ref of a private source repo.
# repo: the org repo (main and merged work) or the personal repo (where fix PR branches live).
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Source repository'
        required: true
        type: choice
        default: 'Outlist2026/outlist'
        options:
          - Outlist2026/outlist
          - FlavioApric/outlist
      ref:
        description: 'Branch, tag or commit'
        required: true
        default: 'main'
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      ref:
        required: true
        type: string
    secrets:
      SOURCE_REPO_TOKEN:
        required: true
      PERSONAL_REPO_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: hotfix-verify-${{ inputs.repo }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IN_REPO: ${{ inputs.repo }}
      IN_REF: ${{ inputs.ref }}
    steps:
      - name: Validate input
        run: |
          printf '%s' "$IN_REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "::error::ref has odd characters"; exit 1; }
          case "$IN_REPO" in Outlist2026/outlist|FlavioApric/outlist) ;; *) echo "::error::repo not allowed"; exit 1 ;; esac
      - name: Checkout source (read-only token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          token: ${{ inputs.repo == 'FlavioApric/outlist' && secrets.PERSONAL_REPO_TOKEN || secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: App install, lint, typecheck, build
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm exec tsc -b
          pnpm build
      - name: Root install and unit tests
        run: |
          npm ci
          npm run test:covers
          node scripts/launch/check-hex.mjs
          npm run test:launch
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Type-check every edge function (deno check)
        timeout-minutes: 15
        run: |
          if [ -d supabase/functions ]; then
            fail=0; for d in supabase/functions/*/; do n=$(basename "$d"); case "$n" in _*) continue;; esac; [ -f "$d/index.ts" ] || continue
              (cd supabase/functions && deno check --quiet --node-modules-dir=none "$n/index.ts") || { echo "::error::deno check failed: $n"; fail=1; }
            done; exit $fail
          fi
      - name: Release unit tests (all sessions) and Curator
        run: |
          if node -e "process.exit(require('./package.json').scripts['test:r35'] ? 0 : 1)"; then npm run test:r35; else echo "no test:r35 on this ref"; fi
          if [ -f curator/package.json ]; then (cd curator && npm test); fi
      - name: Delivery type and native check
        run: |
          if [ -f scripts/fix/gate.mjs ]; then
            git fetch --no-tags --depth=1 origin main 2>/dev/null || true
            node scripts/fix/gate.mjs --list --base "$(git merge-base HEAD origin/main 2>/dev/null || echo HEAD~1)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f tests/launch/ota-compat.test.mjs ]; then
            if node --test tests/launch/ota-compat.test.mjs; then
              echo "### Web only: reaches the 1.1.0 apps by OTA" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### Native change: needs a store build, not OTA" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
