name: Hotfix verify

# Read-only. Runs the fast gate for a web-only hotfix on a ref of the private source repo.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit of Outlist2026/outlist'
        required: true
        default: 'main'

permissions:
  contents: read

concurrency:
  group: hotfix-verify-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IN_REF: ${{ inputs.ref }}
    steps:
      - name: Validate input
        run: |
          printf '%s' "$IN_REF" | grep -Eq '^[A-Za-z0-9._/-]{1,100}$' || { echo "::error::ref has odd characters"; exit 1; }
      - name: Checkout source (read-only token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Outlist2026/outlist
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: App install, lint, typecheck, build
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm exec tsc -b
          pnpm build
      - name: Root install and unit tests
        run: |
          npm ci
          npm run test:covers
          node scripts/launch/check-hex.mjs
          npm run test:launch
      - name: OTA compatibility (web only or store build?)
        run: |
          if node --test tests/launch/ota-compat.test.mjs; then
            echo "### Web only: reaches the 1.1.0 apps by OTA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Native change: needs a store build, not OTA" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
